name: Universal cinematic library
on:
  pull_request:
    paths:
      - 'remotion/blender/**'
      - 'remotion/atlas/universal/**'
      - 'remotion/tests/universal-library.test.mjs'
      - 'remotion/tests/lot-c.test.mjs'
      - 'docs/universal-library/**'
      - 'docs/previews/**'
      - '.github/workflows/universal-library.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry-and-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Video inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Pure library, compatibility and selection tests
        run: |
          python -m unittest discover -s remotion/blender/tests
          python -m unittest discover -s remotion/tests -p test_manifest_import.py
          node --test remotion/tests/universal-library.test.mjs remotion/tests/lot-c.test.mjs
          python remotion/blender/universal/build_index.py --check
      - name: Verify actual shipped Blender media (no synthetic renders)
        run: |
          python remotion/blender/cinematic_vex/verify_evidence.py
          python remotion/blender/venus_vault/verify_evidence.py
          python remotion/blender/universal/verify_media.py
          python remotion/blender/universal/verify_crota.py
          python remotion/blender/universal/approved_gallery.py --check
          python remotion/blender/universal/lot_c_evidence.py --check
