<style>body{margin:0;background:#101922;color:#e8eff6;font:16px system-ui}header,main{max-width:1200px;margin:auto;padding:24px}h1{font-size:30px}a{color:#80dcff}input,select,button{padding:12px;background:#243543;color:inherit;border:1px solid #658294;border-radius:6px;font:inherit;max-width:100%}.filters{display:flex;flex-wrap:wrap;gap:10px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin-top:24px}article{background:#1c2a36;border:1px solid #3b5262;border-radius:10px;padding:18px}article img{width:100%;max-height:300px;object-fit:contain;background:#0a1117}small{color:#b5c8d5}code{display:block;overflow-wrap:anywhere;margin:12px 0;font-size:12px}details{margin-top:12px}li{margin-bottom:8px}.status{color:#a9e1be}#error{color:#ffb1a9}label{display:grid;gap:5px}</style>
<header><h1>Destiny — Universal Cinematic Voxel Library</h1><p>Chantier v1.0 · Les études de famille ne constituent pas des boss ou arènes terminés. Athéon et le Templier conservent leurs modèles validés.</p><p><a href="README.md">Méthode, rendus et limites</a> · <a href="catalog.json">Catalogue inspectable</a></p><p id="summary">Chargement…</p><div class="filters"><label>Recherche<input id="search" type="search" placeholder="Boss, arène, destination ou ID"></label><label>État<select id="status"><option value="">Tous</option><option value="implemented">Implémentés</option><option value="partial">Partiels</option><option value="missing">Manquants</option></select></label><label>Activité<select id="activity"><option value="">Toutes</option></select></label><label>Type<select id="kind"><option value="">Tous</option><option value="boss">Boss / collectifs / mécanismes</option><option value="form">Formes et variantes</option><option value="environment">Environnements</option></select></label></div><p id="error" role="alert"></p></header><main><div id="cards"></div></main>
