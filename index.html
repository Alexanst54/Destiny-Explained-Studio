<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101525"><title>Destiny Explained Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101525;color:#f5f6ff;font-family:system-ui,-apple-system,sans-serif}header{padding:17px 16px;border-bottom:1px solid #303650;display:flex;align-items:center;justify-content:space-between}h1{font-size:17px;margin:0}small,.muted{color:#aab1cf}main{max-width:510px;margin:auto;padding:16px}.stage{position:relative;width:min(100%,340px);aspect-ratio:9/16;margin:0 auto;border:3px solid #454a72;border-radius:18px;overflow:hidden;background:linear-gradient(#7779a8 0 55%,#9f91af 55% 100%);box-shadow:0 14px 35px #0008}.sun{position:absolute;top:13%;left:18%;width:85px;height:85px;border-radius:50%;background:#e9d6ba;opacity:.7}.mount{position:absolute;bottom:38%;width:110%;height:24%;background:#646887;clip-path:polygon(0 100%,18% 32%,38% 76%,57% 16%,78% 70%,100% 24%,100% 100%)}.floor{position:absolute;bottom:0;width:100%;height:36%;background:#49466b}.title{position:absolute;top:7%;width:100%;padding:0 12px;text-align:center;font-weight:1000;font-size:clamp(20px,6vw,28px);line-height:1.08;color:#fff;text-shadow:3px 4px #24263c;letter-spacing:.5px}.hunter{position:absolute;left:24%;bottom:22%;width:45%;height:40%;transform-origin:bottom center;animation:bob 2.3s ease-in-out infinite}.hood{position:absolute;top:0;left:22%;width:57%;height:46%;background:#493e70;border:5px solid #222238;border-radius:48% 48% 38% 38%;z-index:3}.face{position:absolute;top:22%;left:30%;width:42%;height:21%;background:#c3a4c4;border:4px solid #222238;border-radius:45%;z-index:4}.eye{position:absolute;top:40%;width:16%;height:26%;background:#f9e5a2;border-radius:50%;animation:blink 5s infinite}.eye.a{left:22%}.eye.b{right:22%}.body{position:absolute;top:38%;left:16%;width:70%;height:40%;background:#6b5b99;border:5px solid #222238;border-radius:35% 35% 20% 20%;z-index:2}.arm{position:absolute;top:47%;width:22%;height:28%;background:#6b5b99;border:4px solid #222238;border-radius:20px}.arm.a{left:3%;transform:rotate(17deg)}.arm.b{right:0;transform:rotate(-20deg)}.leg{position:absolute;bottom:0;width:26%;height:27%;background:#393756;border:4px solid #222238;border-radius:10px}.leg.a{left:23%}.leg.b{right:18%}.ghost{position:absolute;left:68%;top:38%;width:72px;height:72px;animation:float 2s ease-in-out infinite;filter:drop-shadow(2px 4px 0 #28253e)}.ghost svg{width:100%;height:100%}.subtitles{position:absolute;bottom:9%;left:4%;width:92%;text-align:center;font-weight:1000;text-transform:uppercase;font-size:clamp(17px,5vw,24px);line-height:1.15;color:#ffe16b;text-shadow:-2px -2px #29253b,2px -2px #29253b,-2px 2px #29253b,2px 2px #29253b,0 4px #29253b}.controls{margin:16px 0;display:flex;gap:9px;align-items:center}.controls button,button{border:0;border-radius:12px;background:#8872e5;color:white;font-weight:750;padding:12px 16px;cursor:pointer}.controls input{flex:1;min-width:0;accent-color:#ac92ff}label{display:block;font-size:13px;color:#b7bbd6;margin:15px 0 6px}textarea,input[type=text]{width:100%;border:1px solid #454a72;border-radius:11px;background:#1b2136;color:white;padding:12px;font:inherit}textarea{min-height:95px;resize:vertical}.row{display:flex;gap:10px}.row button{flex:1}.secondary{background:#323c60}footer{text-align:center;padding:18px;color:#9299bb;font-size:12px}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes float{50%{transform:translateY(-15px) rotate(7deg)}}@keyframes blink{0%,46%,49%,100%{transform:scaleY(1)}47%,48%{transform:scaleY(.1)}}.paused .hunter,.paused .ghost,.paused .eye{animation-play-state:paused}
</style></head><body><header><h1>✦ Destiny Explained <span style="color:#bbaaff">Studio</span></h1><small>Prototype 0.1</small></header><main>
<div id="stage" class="stage paused"><div class="sun"></div><div class="mount"></div><div class="floor"></div><div id="sceneTitle" class="title">WHY CAN GUARDIANS RESPAWN?</div><div class="hunter"><div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div><div class="body"></div><div class="hood"></div><div class="face"><div class="eye a"></div><div class="eye b"></div></div></div><div class="ghost"><svg viewBox="0 0 100 100"><path d="M50 3 L65 27 92 13 78 40 97 50 78 60 92 87 65 73 50 97 35 73 8 87 22 60 3 50 22 40 8 13 35 27Z" fill="#d9d5e6" stroke="#222238" stroke-width="6" stroke-linejoin="round"/><circle cx="50" cy="50" r="23" fill="#535070" stroke="#222238" stroke-width="5"/><circle cx="50" cy="50" r="12" fill="#9ddcf5"/><circle cx="50" cy="50" r="5" fill="#fff"/></svg></div><div id="caption" class="subtitles"></div></div>
<div class="controls"><button id="play">▶ Play</button><input id="seek" aria-label="Timeline" type="range" min="0" max="100" value="0"><span id="time">0:00</span></div>
<label for="heading">Scene title</label><input id="heading" type="text" value="WHY CAN GUARDIANS RESPAWN?">
<label for="script">English subtitles (one line per scene)</label><textarea id="script">Ever wondered why Guardians can come back to life?
Meet the Ghost!
These little machines were created by the Traveler.
They can resurrect their chosen Guardians using the Light.
But Guardians aren't completely immortal.
Protect your Ghost!</textarea>
<div class="row"><button id="save">Save edits</button><button class="secondary" id="reset">Reset</button></div>
<p class="muted" style="font-size:13px;line-height:1.5">This is an animated storyboard prototype, not yet a video exporter. Each subtitle is displayed for five seconds. Voiceover and MP4 export will be added later.</p></main><footer>Unofficial fan project • Not affiliated with Bungie</footer>
<script>
const $=id=>document.getElementById(id),defaultScript=$('script').value;let playing=false,elapsed=0,last=0,frame=0;const duration=()=>Math.max(5,$('script').value.split('\n').filter(s=>s.trim()).length*5);function render(){const lines=$('script').value.split('\n').filter(s=>s.trim());$('caption').textContent=lines[Math.min(lines.length-1,Math.floor(elapsed/5))]||'';$('seek').value=elapsed/duration()*100;$('time').textContent='0:'+String(Math.floor(elapsed)).padStart(2,'0');$('sceneTitle').textContent=$('heading').value}function tick(t){if(!playing)return;if(last)elapsed+=(t-last)/1000;last=t;if(elapsed>=duration()){elapsed=0;stop()}render();if(playing)frame=requestAnimationFrame(tick)}function stop(){playing=false;last=0;cancelAnimationFrame(frame);$('play').textContent='▶ Play';$('stage').classList.add('paused')}function start(){playing=true;last=0;$('play').textContent='❚❚ Pause';$('stage').classList.remove('paused');frame=requestAnimationFrame(tick)}$('play').onclick=()=>playing?stop():start();$('seek').oninput=e=>{elapsed=Number(e.target.value)/100*duration();render()};$('heading').oninput=render;$('script').oninput=()=>{elapsed=0;render()};$('save').onclick=()=>{try{localStorage.setItem('destinyStudio',JSON.stringify({title:$('heading').value,script:$('script').value}));alert('Saved on this device')}catch(e){alert('Local saving is unavailable')}};$('reset').onclick=()=>{stop();$('heading').value='WHY CAN GUARDIANS RESPAWN?';$('script').value=defaultScript;elapsed=0;render()};try{const saved=JSON.parse(localStorage.getItem('destinyStudio')||'null');if(saved){$('heading').value=saved.title||'';$('script').value=saved.script||''}}catch(e){}render();
</script></body></html>
